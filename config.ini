; endpoint = https://api-inference.modelscope.cn/v1/chat/completions
; model = deepseek-ai/DeepSeek-V4.1-Flash
; === AgnesAI（当前使用） ===
api_key = sk-REPLACE_WITH_YOUR_KEY
endpoint = https://api.agnes-ai.cn/v1/chat/completions
proxy = 
;  192.168.0.3:7890
; model = gpt-4o
model = agnes-3.0-flash
; model = qwen-max
; model = cc-3-5-haiku-20241022
max_tokens = 4000
temperature = 0.6
top_p = 1
n = 1

[Fine-tuning]
; === ModelScope（暂时停用，保留备用） ===
; api_key = ms-REPLACE_WITH_YOUR_KEY
; endpoint = https://api-inference.modelscope.cn/v1
; model = deepseek-ai/DeepSeek-V4.1-Flash
; === AgnesAI（当前使用） ===
api_key = sk-REPLACE_WITH_YOUR_KEY
endpoint = https://api.agnes-ai.cn/v1
model = agnes-3.0-flash
max_tokens = 8196
temperature = 0.6
timeout = 300
retries = 2

[Session]
source_session = core/llm/source_session.json
sink_session = core/llm/sink_session.json
