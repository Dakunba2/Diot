[Info]
device = TOTOLink-EX200

[ResultDir]
root = result
lib_path = libs
ghidra = ghidra_res
iot_file = iot_file
elf_parse = elf_parse

[VulFunction]
buffer_overflow = memcpy, strcpy, sprintf, sscanf, strcat
command_injection = system, exec, popen
param = {"system": "1", "popen": "1"}

[Script]
check_unsafe_function = unsafe_func.py
aa = bb

[Neo4j]
uri = neo4j://localhost:7687
user = neo4j
password = REPLACE_NEO4J_PASSWORD
database = neo4j

[LLM]
; === ModelScope（暂时停用，保留备用） ===
